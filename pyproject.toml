[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "humanizer-mcp-server"
version = "0.1.0"
description = "An English and Arabic text humanizer exposed as an MCP server."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.0,<3.0",
    "langchain-core>=1.0,<2.0",
    "langchain-groq>=1.0,<2.0",
    "langdetect>=1.0.9,<2.0",
    "numpy>=1.26,<3.0",
    "pydantic>=2.0,<3.0",
    "redis>=5.0,<8.0",
    "sentence-transformers>=3.0,<7.0",
    "requests>=2.31,<3.0",
]

[project.scripts]
humanizer-mcp = "humanizer_server:main"

[tool.setuptools]
py-modules = ["humanizer_server", "my_available_groq_models"]
